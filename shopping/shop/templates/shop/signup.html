<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | StyleHub</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f7f7f7; color: #222; }
        .container { max-width: 420px; margin: 60px auto; padding: 24px; }
        .card { background: white; border-radius: 18px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.06); }
        input { width: 100%; padding: 10px; margin: 8px 0 12px; border: 1px solid #ddd; border-radius: 8px; }
        .btn { display: inline-block; width: 100%; text-align: center; padding: 12px; background: #ff4d6d; color: white; text-decoration: none; border: none; border-radius: 999px; cursor: pointer; }
        a { color: #c21f48; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Sign Up</h1>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn" type="submit">Create Account</button>
            </form>
            <p style="margin-top: 12px;">Already have an account? <a href="/login/">Login</a></p>
        </div>
    </div>
</body>
</html>
