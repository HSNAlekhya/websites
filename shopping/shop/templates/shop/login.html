<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | StyleHub</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f7f7f7; color: #222; }
        .container { max-width: 450px; margin: 60px auto; padding: 26px; }
        .card { background: white; border-radius: 21px; padding: 30px; box-shadow: 0 15px 30px rgba(0,0,0,0.06); }
        input { width: 100%; padding: 8px; margin: 10px 0 14px; border: 2px solid #ddd; border-radius: 8px; }
        .btn { display: inline-block; width: 100%; text-align: center; padding: 12px; background: #ff4d6d; color: white; text-decoration: none; border: none; border-radius: 999px; cursor: pointer; }
        a { color: #c21f48; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Login</h1>
            <form method="post">
                {% if error_message %}
                    <p style="color: red;">{{ error_message }}</p>
                {% endif %}
                {% csrf_token %}
                <label>Username</label>
                <input type="text" name="username" required>
                <label>Password</label>
                <input type="password" name="password" required>
                <button class="btn" type="submit">Login</button>
            </form>
            <p style="margin-top: 12px;">No account? <a href="/signup/">Sign up</a></p>
        </div>
    </div>
</body>
</html>
