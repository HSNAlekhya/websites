<!DOCTYPE html>
<html lang="en">
<head>

    <title>Logout | StyleHub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #fff7fb 0%, #fffbe8 100%);

            display: flex;
