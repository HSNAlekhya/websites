{% extends 'base.html' %}

{% block content %}

<h1>Checkout</h1>

<div class="checkout-container">

    <div class="checkout-form">

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn">
                Place Order
            </button>

        </form>

    </div>

    <div class="order-summary">

        <h2>Order Summary</h2>

        <table>

            {% for item in items %}

            <tr>

                <td>{{ item.product.name }}</td>

                <td>{{ item.quantity }}</td>

                <td>₹{{ item.subtotal }}</td>

            </tr>

            {% endfor %}

        </table>

        <hr>

        <h3>Total : ₹{{ total }}</h3>

    </div>

</div>

{% endblock %}
